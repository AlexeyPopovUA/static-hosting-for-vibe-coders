<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1117;
        --card: #171a22;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #7c9cff;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f7fb;
          --card: #ffffff;
          --text: #111827;
          --muted: #6b7280;
          --accent: #3b5bdb;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(124, 156, 255, 0.18), transparent 45%),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          sans-serif;
      }

      main {
        width: min(92vw, 32rem);
        padding: 2rem;
        border: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
        border-radius: 1rem;
        background: var(--card);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
        text-align: center;
      }

      p.label {
        margin: 0 0 0.5rem;
        font-size: 0.875rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 2.75rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">404</p>
      <h1>Page not found</h1>
      <p>The page you requested does not exist or has not been deployed yet.</p>
    </main>
  </body>
</html>
