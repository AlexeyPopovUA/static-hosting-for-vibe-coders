<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello — Static Hosting Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <p class="label">Demo app</p>
      <h1>Hello from static hosting</h1>
      <p class="lead">
        This page is served from S3 via CloudFront at
        <code id="host-label"></code>.
      </p>
      <ul class="links">
        <li><a id="palette-link" href="#">Open the palette demo</a></li>
      </ul>
      <p class="meta">Deployed by CDK · branch folder: <code>main</code></p>
    </main>
    <script>
      (function () {
        var parts = location.hostname.split('.');
        document.getElementById('host-label').textContent = location.hostname;
        parts[0] = 'palette';
        document.getElementById('palette-link').href = location.protocol + '//' + parts.join('.');
      })();
    </script>
  </body>
</html>
