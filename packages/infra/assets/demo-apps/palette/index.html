<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Palette — Static Hosting Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="label">Demo app</p>
        <h1>Color palette</h1>
        <p class="lead">Click a swatch to copy its hex value. Static CSS and JS are loaded separately.</p>
      </header>

      <div id="swatches" class="swatches" aria-live="polite"></div>

      <p id="status" class="status" aria-live="polite">Pick a color</p>

      <p class="meta">
        <a id="hello-link" href="#">Back to hello demo</a>
      </p>
    </main>
    <script>
      (function () {
        var parts = location.hostname.split('.');
        parts[0] = 'hello';
        document.getElementById('hello-link').href = location.protocol + '//' + parts.join('.');
      })();
    </script>
    <script src="app.js"></script>
  </body>
</html>
